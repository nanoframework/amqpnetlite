name: Merge into nano-develop

on:
  schedule:
    - cron: '05 00 * * *'
  workflow_dispatch:

concurrency:
  group: merge-nano-master-into-nano-develop
  cancel-in-progress: false

jobs:
  merge-into-nano-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: nano-develop
          fetch-depth: 0
          token: ${{ secrets.NFBOT_GITHUB_ACTIONS }}

      - name: Merge nano-master into nano-develop
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"
          git fetch --no-tags origin nano-master
          git merge --no-edit origin/nano-master
          git push origin HEAD:nano-develop

      - name: Report synchronization failure
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          echo "::error::Could not merge nano-master into nano-develop. Check the sync logs and resolve any conflicts manually; no forced update is performed."
