name: Update .NET nanoFramework dependencies (nano-develop)

on:
  schedule:
    - cron: '10 00 * * Wed,Fri'
  workflow_dispatch:
  repository_dispatch:
    types: update-dependencies-develop

jobs:
  update-dependencies:
    name: nanoFramework preview
    uses: nanoframework/nf-tools/.github/workflows/update-dependencies.yml@main
    secrets: inherit
    with:
      timeout-minutes: 180
      solutionsToCheck: 'amqp-nanoFramework.sln'
      workingDirectory: main
      previewPackages: true
      branchToPr: nano-develop
      repoOwner: nanoframework
