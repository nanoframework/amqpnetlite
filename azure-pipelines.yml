# Automatic builds are triggered by the entry points on the source branches.
trigger: none
pr: none

parameters:
  - name: sourceBranch
    displayName: AMQP source branch
    type: string
    default: nano-master
    values:
      - nano-master
      - nano-develop

extends:
  template: azure-pipelines-template.yml
  parameters:
    sourceBranch: ${{ parameters.sourceBranch }}
